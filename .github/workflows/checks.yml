name: Checks

# Every pull request, and main after a merge, must pass what a release
# needs: the format, the analyzer, the tests of the package and of the
# example, and a publish dry run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The version the package is developed with, so the format and
          # the analyzer agree with local runs.
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test the example
        working-directory: example
        run: flutter test
      - name: Publish dry run
        run: dart pub publish --dry-run

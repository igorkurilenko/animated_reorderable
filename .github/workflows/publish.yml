name: Publish to pub.dev

on:
  push:
    tags:
      # Matches the tag pattern v{{version}} set on pub.dev (Admin > Automated publishing).
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Signs in to pub.dev with a GitHub OIDC token.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
